      // Gracefully prevent unhandled WebSocket/iframe preview network noise
      (function() {
        var ignorableKeywords = [
          "reading 'send'",
          "reading 'addEventListener'",
          "WebSocket",
          "failed to connect",
          "NetworkError",
          "Load failed",
          "ServiceWorker",
          "sandbox flags",
          "SecurityError",
          "before connect"
        ];

        function isIgnorable(err) {
          if (!err) return false;
          var msg = String(err.message || err.reason || err || '');
          for (var i = 0; i < ignorableKeywords.length; i++) {
            if (msg.indexOf(ignorableKeywords[i]) !== -1) return true;
          }
          return false;
        }

        window.addEventListener('unhandledrejection', function(e) {
          if (isIgnorable(e.reason)) {
            if (e.preventDefault) e.preventDefault();
          }
        });

        // Proactively unregister any stale service workers in dev/preview iframe to prevent white screen
        if ('serviceWorker' in navigator) {
          try {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              for (var i = 0; i < regs.length; i++) {
                regs[i].unregister();
              }
            }).catch(function() {});
            if (typeof caches !== 'undefined' && caches && caches.keys) {
              caches.keys().then(function(keys) {
                for (var i = 0; i < keys.length; i++) {
                  if (keys[i] !== 'banglabazar-pwa-v3') {
                    caches.delete(keys[i]);
                  }
                }
              }).catch(function() {});
            }
          } catch (_) {}
        }
      })();
